<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Evolução dos commits</title>
  <desc id="desc">Aguardando a primeira atualização automática do histórico de commits.</desc>
  <defs>
    <linearGradient id="lineGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#B8E6FF"/>
      <stop offset="55%" stop-color="#9ED8FA"/>
      <stop offset="100%" stop-color="#C8B6FF"/>
    </linearGradient>
    <style>
      .title { fill: #E6EDF3; font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .accent { fill: #B8E6FF; font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill: #8B949E; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="318" rx="18" fill="#0D1117" stroke="#30363D"/>
  <text x="42" y="42" class="title">EVOLUÇÃO DOS COMMITS</text>
  <text x="42" y="67" class="muted">commits que contam como contribuição no GitHub · janela visual de 365 dias</text>
  <line x1="92" y1="242" x2="860" y2="242" stroke="#30363D"/>
  <path d="M 92 226 C 235 226 270 202 382 202 S 565 167 666 167 S 785 126 860 126" fill="none" stroke="url(#lineGradient)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="860" cy="126" r="6" fill="#C8B6FF" stroke="#B8E6FF" stroke-width="3"/>
  <text x="450" y="278" text-anchor="middle" class="accent">Primeira atualização automática em andamento…</text>
</svg>
