name: Update profile commit graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile_stats.py"
      - "scripts/render_commit_history_gif.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-commit-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GIF renderer
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0

      - name: Generate commit history
        env:
          # O valor bruto fica somente no ambiente do runner e nunca é impresso.
          # PATs do GitHub não contêm espaços; remover whitespace também corrige
          # quebras de linha acidentais copiadas junto do secret.
          RAW_PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: bielxdh3
        shell: bash
        run: |
          export PROFILE_STATS_TOKEN="$(printf '%s' "$RAW_PROFILE_STATS_TOKEN" | tr -d '[:space:]')"
          python scripts/update_profile_stats.py
          python scripts/render_commit_history_gif.py

      - name: Commit generated data as bot
        shell: bash
        run: |
          git add assets/commit-history.svg assets/commit-history.gif data/commit-history.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile commit graph"
          git push
